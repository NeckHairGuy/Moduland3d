<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Art Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <button id="selectBtn" class="tool-btn active">Select</button>
            <button id="saveStructureBtn" class="tool-btn">Save Structure</button>
            <button id="loadStructureBtn" class="tool-btn">Load Structure</button>
            <div class="separator"></div>
            <label>Grid X:</label>
            <input type="range" id="gridXSlider" min="5" max="50" value="20" class="grid-slider">
            <span id="gridXValue">20</span>
            <label>Grid Z:</label>
            <input type="range" id="gridZSlider" min="5" max="50" value="20" class="grid-slider">
            <span id="gridZValue">20</span>
            <div class="separator"></div>
            <label>Height Limit:</label>
            <input type="range" id="heightSlider" min="2" max="60" value="20" class="height-slider">
            <span id="heightValue">20</span>
            <div class="separator"></div>
            <span class="info-text">Click to select • Delete to remove • Shift for gizmo • Shift+right-drag to pan • Space to clear • F for focus</span>
            <div id="focusIndicator" class="focus-indicator" style="display: none;">
                <span>FOCUS MODE</span>
            </div>
        </div>
        
        <div id="scene-container"></div>
        
        <div id="buildify-menu" class="buildify-menu" style="display: none;">
            <div class="buildify-header">
                <h3>BUILDIFY</h3>
                <button id="closeBuildify" class="close-btn">×</button>
            </div>
            <div class="buildify-content">
                <div class="buildify-section">
                    <label>Model Description</label>
                    <textarea id="modelDescription" placeholder="Describe what you want to create..." rows="4"></textarea>
                </div>
                
                <div class="buildify-section">
                    <label>Detail Level</label>
                    <input type="range" id="detailLevel" min="1" max="10" value="5" class="buildify-slider">
                    <span id="detailValue">5</span>
                </div>
                
                <div class="buildify-section">
                    <label>Voxel Resolution</label>
                    <select id="voxelResolution">
                        <option value="low">Low (0.5x)</option>
                        <option value="medium" selected>Medium (1x)</option>
                        <option value="high">High (2x)</option>
                        <option value="ultra">Ultra (4x)</option>
                    </select>
                </div>
                
                <div class="buildify-section">
                    <label>Color Palette</label>
                    <select id="colorPalette">
                        <option value="auto">Auto-detect</option>
                        <option value="vibrant">Vibrant</option>
                        <option value="pastel">Pastel</option>
                        <option value="monochrome">Monochrome</option>
                        <option value="earth">Earth Tones</option>
                    </select>
                </div>
                
                <div class="buildify-section">
                    <label>Style</label>
                    <select id="buildStyle">
                        <option value="realistic">Realistic</option>
                        <option value="cartoon">Cartoon</option>
                        <option value="minecraft">Minecraft-like</option>
                        <option value="abstract">Abstract</option>
                    </select>
                </div>
                
                <div class="buildify-section">
                    <label>Advanced Options</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="preserveStructure" checked>
                            <span>Preserve base structure</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="smoothEdges">
                            <span>Smooth edges</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="addDetails" checked>
                            <span>Add surface details</span>
                        </label>
                    </div>
                </div>
                
                <div class="buildify-actions">
                    <button id="generateModel" class="buildify-btn primary">Generate Model</button>
                    <button id="previewModel" class="buildify-btn">Preview</button>
                    <button id="resetModel" class="buildify-btn danger">Reset</button>
                </div>
                
                <div id="buildifyProgress" class="buildify-progress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <span class="progress-text">Generating...</span>
                </div>
            </div>
        </div>
        
        <div id="structures-menu">
            <div class="menu-header">Saved Structures</div>
            <div id="structures-list"></div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
