<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Art Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <button id="selectBtn" class="tool-btn active">Select</button>
            <button id="saveStructureBtn" class="tool-btn">Save Structure</button>
            <button id="loadStructureBtn" class="tool-btn">Load Structure</button>
            <button id="isoViewBtn" class="tool-btn">Iso View</button>
            <div class="separator"></div>
            <label>Grid X:</label>
            <input type="range" id="gridXSlider" min="5" max="50" value="20" class="grid-slider">
            <span id="gridXValue">20</span>
            <label>Grid Z:</label>
            <input type="range" id="gridZSlider" min="5" max="50" value="20" class="grid-slider">
            <span id="gridZValue">20</span>
            <div class="separator"></div>
            <label>Height Limit:</label>
            <input type="range" id="heightSlider" min="2" max="60" value="20" class="height-slider">
            <span id="heightValue">20</span>
            <div class="separator"></div>
            <span class="info-text">Click to select • Delete to remove • Shift for gizmo • Shift+right-drag to pan • Space to clear • F for focus</span>
            <div id="focusIndicator" class="focus-indicator" style="display: none;">
                <span>FOCUS MODE</span>
            </div>
        </div>
        
        <div id="scene-container"></div>
        
        <div id="buildify-menu" class="buildify-menu" style="display: none;">
            <div class="buildify-header">
                <h3>BUILDIFY</h3>
                <button id="closeBuildify" class="close-btn">×</button>
            </div>
            <div class="buildify-content">
                <div class="buildify-section">
                    <button id="captureStructureBtn" class="buildify-btn primary">Capture Structure</button>
                </div>
                <div id="captureGallery" class="capture-gallery"></div>
            </div>
        </div>
        
        <div id="structures-menu">
            <div class="menu-header">Saved Structures</div>
            <div id="structures-list"></div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
